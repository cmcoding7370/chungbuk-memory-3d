<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5e9" />
    <meta name="description" content="충북의 관광지와 특산물 짝을 찾는 3D 보드게임" />
    <title>충북 동네 한바퀴</title>
    <link rel="icon" type="image/png" href="./assets/share/favicon.png" />
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; background: #f8f5e9; color: #294b31; font-family: system-ui, sans-serif; z-index: 1000; }
      #boot img { display: block; width: 76px; height: 76px; object-fit: cover; border-radius: 22px; margin: auto; }
      #boot strong { font-size: 24px; }
      #boot .loading { width: 180px; height: 5px; background: #e1e8d4; border-radius: 9px; overflow: hidden; margin: 2px auto; }
      #boot .loading::before { content: ''; display: block; width: 40%; height: 100%; background: #588a4c; border-radius: inherit; animation: loading 1s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(0) } to { transform: translateX(150%) } }
      #boot small { color: #6c7e65; }
    </style>
  </head>
  <body>
    <div id="boot"><img src="./assets/share/favicon.png" alt="" /><strong>충북 동네 한바퀴</strong><div class="loading"></div><small>보드게임을 준비하고 있어요</small></div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
